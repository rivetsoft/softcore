name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # What a compositor links: the seat, input devices, displays and their names, the GPU's
      # buffers, the keyboard, and PipeWire for screen sharing (whose bindings need clang).
      - name: Install the compositor's libraries
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev
          libegl-dev libwayland-dev libpipewire-0.3-dev libdisplay-info-dev libclang-dev
          pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --workspace

      - name: Test
        run: cargo test --locked --workspace
