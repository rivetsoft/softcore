# Which portal backend answers what in a Softcore session, every interface named, so none is
# left to chance. The manual's table says why each is where it is.
[preferred]
default=rivet;gtk;
# Softcore's own.
org.freedesktop.impl.portal.ScreenCast=softcore
org.freedesktop.impl.portal.Screenshot=softcore
org.freedesktop.impl.portal.Inhibit=softcore
org.freedesktop.impl.portal.GlobalShortcuts=softcore
# Through Rivet Shell, which sets it and makes the desktop's colors from it.
org.freedesktop.impl.portal.Wallpaper=softcore
# Dark or light and the accent are Softcore's; GTK's come after, for what only GTK knows.
org.freedesktop.impl.portal.Settings=softcore;gtk;
# Rivet Files, and GTK's where Files isn't installed.
org.freedesktop.impl.portal.FileChooser=rivet;gtk;
# GTK's: dialogs Rivet has no window of its own for. Notifications go on to the desktop's
# notification service, which is Rivet Shell's.
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.Account=gtk
org.freedesktop.impl.portal.Email=gtk
org.freedesktop.impl.portal.Print=gtk
org.freedesktop.impl.portal.DynamicLauncher=gtk
org.freedesktop.impl.portal.Notification=gtk
# The keyring: GNOME Keyring's, else oo7's.
org.freedesktop.impl.portal.Secret=gnome-keyring;oo7-portal;
# Not offered under Softcore.
org.freedesktop.impl.portal.Background=none
org.freedesktop.impl.portal.Lockdown=none
org.freedesktop.impl.portal.RemoteDesktop=none
org.freedesktop.impl.portal.Clipboard=none
org.freedesktop.impl.portal.InputCapture=none
org.freedesktop.impl.portal.Usb=none
