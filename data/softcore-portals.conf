# Which portal backend answers what in a Softcore session. Screen sharing, screenshots and the
# appearance apps follow (dark or light, the accent) are Softcore's own; the rest is Rivet's
# (the file picker is Rivet Files), then GTK's for what Rivet lacks. GTK's settings come after
# Softcore's, for what only GTK knows (fonts, cursor, GNOME's own keys).
[preferred]
default=rivet;gtk;
org.freedesktop.impl.portal.ScreenCast=softcore
org.freedesktop.impl.portal.Screenshot=softcore
org.freedesktop.impl.portal.Settings=softcore;gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring
